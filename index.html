<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:linear-gradient(
180deg,
#87CEEB,
#FFD6EC,
#FFF6B7
);
padding:20px;
}

.header{
background:white;
border-radius:30px;
padding:20px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,.2);
margin-bottom:20px;
}

.header h1{
font-size:48px;
color:#ff5a5a;
}

.header h2{
font-size:32px;
color:#3c78d8;
}

.hero{
display:flex;
justify-content:center;
align-items:center;
gap:20px;
flex-wrap:wrap;
margin-top:15px;
}

.hero img{
width:120px;
}

.question{
background:white;
padding:20px;
border-radius:25px;
margin-bottom:20px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.question img{
width:100px;
display:block;
margin:auto;
}

.question h3{
margin:10px 0;
color:#ff6b00;
}

.option{
display:block;
margin:8px 0;
padding:10px;
border-radius:12px;
background:#f4f4f4;
cursor:pointer;
}

.option:hover{
background:#dff4ff;
}

button{
padding:15px 30px;
font-size:18px;
background:#4CAF50;
color:white;
border:none;
border-radius:20px;
cursor:pointer;
display:block;
margin:20px auto;
}

.result{
background:white;
padding:20px;
border-radius:20px;
font-size:24px;
text-align:center;
display:none;
}

.footer{
margin-top:30px;
text-align:center;
font-weight:bold;
font-size:20px;
color:#444;
}
</style>

</head>

<div class="hero">

const quiz=document.getElementById("quiz");

soal.forEach((s,i)=>{
let html=`
<div class="question">
<img src="${s.gambar}">
<h3>${s.tanya}</h3>
`;

s.pilihan.forEach((p,j)=>{
html+=`
<label class="option">
<input type="radio" name="q${i}" value="${j}">
${p}
</label>`;
});

html+=`</div>`;
quiz.innerHTML+=html;
});

function cekJawaban(){

let skor=0;

soal.forEach((s,i)=>{
let pilih=document.querySelector(`input[name=q${i}]:checked`);

if(pilih && parseInt(pilih.value)===s.jawab){
skor++;
}
});

let nilai=Math.round((skor/30)*100);

document.getElementById("hasil").style.display="block";

document.getElementById("hasil").innerHTML=
`
🏆 Jawaban Benar : ${skor} dari 30 Soal<br><br>
📚 Nilai : ${nilai}
`;
window.scrollTo(0,document.body.scrollHeight);
}
