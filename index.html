}

.banner{
width:100%;
display:block;
}

.container{
max-width:1200px;
margin:auto;
padding:15px;
}

text-align:center;
color:#ff4d6d;
}

.soal{

border-radius:20px;

.opsi{

border-radius:10px;
background:#f4f4f4;

}

.opsi:hover{
background:#d6f0ff;
}

button{
display:block;
margin:25px auto;
padding:15px 35px;
font-size:20px;
border:none;
border-radius:20px;
background:#00b894;
color:white;
}

#hasil{
display:none;
background:white;
padding:20px;
border-radius:20px;
text-align:center;
font-size:24px;
margin-bottom:30px;
}

</style>

const quiz=document.getElementById("quiz");

soal.forEach((s,i)=>{

let html=`
<div class="soal">

<span class="nomor">${i+1}</span>

<img src="${s.gambar}" class="gambar">

<h3>${s.tanya}</h3>
`;

s.opsi.forEach((o,j)=>{
html+=`
<label class="opsi">
<input type="radio" name="q${i}" value="${j}">
${o}
</label>
`;
});

html+="</div>";

quiz.innerHTML+=html;

});

function cek(){

let benar=0;

soal.forEach((s,i)=>{

let pilih=document.querySelector(`input[name=q${i}]:checked`);

if(pilih && Number(pilih.value)===s.jawab){
benar++;
}

});

let nilai=Math.round((benar/30)*100);

let hasil=document.getElementById("hasil");

hasil.style.display="block";

hasil.innerHTML=
`
🏆 Jawaban Benar : ${benar}/30<br><br>
📚 Nilai : ${nilai}
`;

window.scrollTo(0,document.body.scrollHeight);

}
